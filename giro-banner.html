<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giro Banner</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }
    .wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
    }
    iframe {
      border: 0;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <lottie-player
    src="GiroBanner.json"
    background="transparent"
    speed="1"
    loop
    autoplay
    style="width:100%; height:100%;">
  </lottie-player>
</body>
</html>
